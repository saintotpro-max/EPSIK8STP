apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - namespace.yaml
  - secret-postgres.yaml
  - secret-flatnotes.yaml
  - configmap.yaml
  - ../../base
  - flatnotes
  - pvc-backup.yaml
  - cronjob-backup.yaml
  - ingress.yaml
  - gitea-lb.yaml
  - rbac.yaml
  - networkpolicy.yaml
labels:
  - includeSelectors: false
    pairs:
      env: prod
