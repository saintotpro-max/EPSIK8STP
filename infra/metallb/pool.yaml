apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: pool-kind
  namespace: metallb-system
spec:
  addresses:
    - 172.23.255.200-172.23.255.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-kind
  namespace: metallb-system
spec:
  ipAddressPools:
    - pool-kind
